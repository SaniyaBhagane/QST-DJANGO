<!DOCTYPE html>
<html>
<head>
    <title>Show Mobiles</title>
</head>
<body>

<h2>Saved Mobiles</h2>

<ul>
    {% for mobile in mobiles %}
        <li>{{ mobile.name }} - {{ mobile.contact }}</li>
    {% empty %}
        <li>No mobiles added yet</li>
    {% endfor %}
</ul>

<a href="{% url 'add' %}">Add More</a>

</body>
</html>
