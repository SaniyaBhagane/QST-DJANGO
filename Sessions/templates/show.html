{% extends 'base.html' %}

{% block title %}Show Mobiles{% endblock %}

{% block content %}
<h2>📄 Saved Mobiles</h2>

{% if mobiles %}
    {% for mobile in mobiles %}
        <div class="card">
            <div>
                <strong>{{ mobile.name }}</strong><br>
                📞 {{ mobile.contact }}
            </div>
            <a href="{% url 'delete' forloop.counter0 %}">
                <button class="btn-danger">Delete</button>
            </a>
        </div>
    {% endfor %}
{% else %}
    <p style="text-align:center;">No mobiles added yet.</p>
{% endif %}

<br>
<a href="{% url 'add' %}">➕ Add New</a>
{% endblock %}
